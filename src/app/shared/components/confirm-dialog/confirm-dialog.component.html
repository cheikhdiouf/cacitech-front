<div mat-dialog-content class="confirm-dialog">
  <span class="confirm-dialog__icon" [class.confirm-dialog__icon--destructive]="data.destructive">
    <mat-icon>{{ data.icon ?? 'help_outline' }}</mat-icon>
  </span>
  <h2 class="confirm-dialog__title">{{ data.title }}</h2>
  <p class="confirm-dialog__message">{{ data.message }}</p>
</div>

<div mat-dialog-actions>
  <button mat-flat-button color="warn" type="button" (click)="cancel()">
    <mat-icon>close</mat-icon>
    <span>{{ data.cancelLabel ?? 'Annuler' }}</span>
  </button>
  <button
    mat-flat-button
    type="button"
    [color]="data.destructive ? 'warn' : 'primary'"
    (click)="confirm()"
  >
    <mat-icon>check</mat-icon>
    <span>{{ data.confirmLabel ?? 'Confirmer' }}</span>
  </button>
</div>

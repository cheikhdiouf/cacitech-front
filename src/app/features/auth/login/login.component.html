<div class="auth-card__header login-header">
  <span class="login-header__logo">
    <mat-icon>apartment</mat-icon>
  </span>
  <h2>Connexion</h2>
  <p class="login-header__subtitle">Accédez à votre espace Cacitech</p>
</div>

@if (serverError(); as error) {
<app-auth-alert type="error" [message]="error" />
}

<form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <app-text-field
    label="Identifiant"
    icon="person_outline"
    type="text"
    formControlName="username"
    autocomplete="username"
    [required]="true"
    [errorMessage]="username.invalid && username.touched ? usernameErrorMessage() : null"
  />

  <app-password-field formControlName="password" autocomplete="current-password"
    [errorMessage]="password.invalid && password.touched ? passwordErrorMessage() : null" />

  <div class="auth-form__options">
    <mat-checkbox formControlName="rememberMe">Se souvenir de moi</mat-checkbox>
  </div>

  <button mat-flat-button color="primary" class="auth-submit" type="submit" [disabled]="isSubmitting()">
    @if (isSubmitting()) {
    <mat-spinner diameter="20" color="accent" />
    } @else {
    <span>Se connecter</span>
    }
  </button>
</form>

<app-dialog-header [title]="title" icon="apartment" />

@if (loading()) {
  <app-dialog-loading [minHeight]="430" />
} @else {
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div mat-dialog-content class="organe-form__content">
      <app-form-section label="Informations" icon="info_outline" />

      <app-text-field
        label="Entité (direction, service, ...)"
        icon="apartment"
        formControlName="organe"
        [required]="true"
        [errorMessage]="organe.invalid && organe.touched ? 'Le nom de l’entité est requis.' : null"
      />
      <app-text-field
        label="Abréviation"
        icon="short_text"
        formControlName="abreviation"
        [required]="true"
        [errorMessage]="abreviation.invalid && abreviation.touched ? 'L’abréviation est requise.' : null"
      />

      <app-form-section label="Rattachement" icon="account_tree" />

      <mat-form-field appearance="outline">
        <mat-label>Tutelle</mat-label>
        <mat-select formControlName="organe_superieure">
          <mat-option [value]="''">Aucune</mat-option>
          @for (organe of organesDisponibles(); track organe.id) {
            <mat-option [value]="organe.id">{{ organe.organe }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Responsable</mat-label>
        <mat-select formControlName="responsable">
          <mat-option [value]="''">Aucun</mat-option>
          @for (profil of profils(); track profil.id) {
            <mat-option [value]="profil.id">{{ profil.prenom }} {{ profil.nom }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-checkbox formControlName="actif">Entité active</mat-checkbox>
    </div>

    <div mat-dialog-actions>
      <app-form-actions [isEdit]="isEdit" [submitting]="isSubmitting()" (cancel)="cancel()" />
    </div>
  </form>
}

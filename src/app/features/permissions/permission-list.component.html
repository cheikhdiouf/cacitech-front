<app-breadcrumb />

<div class="list-page__header">
  <app-search-field
    class="list-page__search"
    placeholder="Rechercher une permission..."
    [value]="search()"
    (valueChange)="onSearchChange($event)"
  />
  <div class="list-page__header-actions">
    <button mat-stroked-button [matMenuTriggerFor]="exportMenu">
      <mat-icon>file_download</mat-icon>
      Exporter
    </button>
    <mat-menu #exportMenu="matMenu">
      <button mat-menu-item (click)="exportExcel()">
        <mat-icon>grid_on</mat-icon>
        <span>Excel (.xlsx)</span>
      </button>
      <button mat-menu-item (click)="exportPdf()">
        <mat-icon>picture_as_pdf</mat-icon>
        <span>PDF</span>
      </button>
    </mat-menu>
  </div>
</div>

@if (loading()) {
  <div class="list-page__table-wrap">
    <app-table-skeleton [columns]="displayedColumns.length" />
  </div>
} @else if (error()) {
  <div class="list-page__state list-page__state--error">
    <mat-icon>error_outline</mat-icon>
    <p>{{ error() }}</p>
    <button mat-stroked-button class="list-page__retry" (click)="load()">
      <mat-icon>refresh</mat-icon>
      Réessayer
    </button>
  </div>
} @else {
  <div class="list-page__table-wrap">
    <table mat-table [dataSource]="dataSource" matSort class="list-page__table list-page__table--plain">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nom</th>
        <td mat-cell *matCellDef="let permission">{{ permission.name }}</td>
      </ng-container>

      <ng-container matColumnDef="codename">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Code</th>
        <td mat-cell *matCellDef="let permission">{{ permission.codename }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let permission; columns: displayedColumns"></tr>

      <tr *matNoDataRow>
        <td [attr.colspan]="displayedColumns.length" class="list-page__empty">
          {{ search() ? 'Aucune permission ne correspond à votre recherche.' : 'Aucune permission trouvée.' }}
        </td>
      </tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25, 50]" [pageSize]="10" showFirstLastButtons aria-label="Pages de permissions">
    </mat-paginator>
  </div>
}

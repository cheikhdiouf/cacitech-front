<app-dialog-header [title]="title" icon="group" />

@if (loading()) {
  <app-dialog-loading [minHeight]="380" />
} @else {
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div mat-dialog-content class="groupe-form__content">
      <app-form-section label="Informations" icon="info_outline" />

      <app-text-field
        label="Nom"
        icon="badge"
        formControlName="nom"
        [required]="true"
        [errorMessage]="nom.invalid && nom.touched ? 'Le nom est requis.' : null"
      />

      <app-text-field label="Description" icon="notes" formControlName="description" />

      <mat-checkbox formControlName="actif">Groupe actif</mat-checkbox>

      <app-form-section label="Permissions" icon="lock_outline" />

      <fieldset class="groupe-form__permissions">
        @for (permission of permissions(); track permission.id) {
          <mat-checkbox
            class="groupe-form__permission"
            [checked]="isPermissionSelected(permission.id)"
            (change)="togglePermission(permission.id, $event.checked)"
          >
            {{ permission.name }}
          </mat-checkbox>
        } @empty {
          <p class="groupe-form__empty">Aucune permission disponible.</p>
        }
      </fieldset>
    </div>

    <div mat-dialog-actions>
      <app-form-actions [isEdit]="isEdit" [submitting]="isSubmitting()" (cancel)="cancel()" />
    </div>
  </form>
}
